AutoName: Audio Studio Tycoon
Summary: Tiefgründige Spieleentwickler-Simulation – 100% barrierefrei für Blinde & Sehbehinderte
Description: |-
  Audio Studio Tycoon ist eine tiefgründige Wirtschafts- und Spieleentwickler-Simulation,
  die speziell für blinde, sehbehinderte und sehende Menschen entwickelt wurde.

  Features:
  - 100% Barrierefreiheit mit TalkBack-Unterstützung
  - Akustisches Feedback und Sprachausgabe für alle Spielelemente
  - Gründen und verwalten Sie Ihr eigenes Studio von 1980 bis heute
  - Forschung, Mitarbeiter, Blockbuster-Produktionen
  - 100% werbefrei und ohne In-App-Käufe

